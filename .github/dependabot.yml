version: 2
updates:
  # Yarn lockfiles: root, docs and any compatibility applications.
  # 涵蓋根目錄、文件站及相容性應用的 Yarn lockfile。
  - package-ecosystem: npm
    directories:
      - /
      - /docs
      - /compat/*
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    groups:
      action-updates:
        patterns: ['*']
